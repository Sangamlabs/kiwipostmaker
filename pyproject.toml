[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "postbot"
version = "1.0.0"
description = "Production Telegram Post Maker & Scheduler Bot"
authors = [{ name = "Postbot Developer" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=22.8",
    "motor>=3.7.0",
    "pymongo>=4.18.0",
    "apscheduler>=3.11.3",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
